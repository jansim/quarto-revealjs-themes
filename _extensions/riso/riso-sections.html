<script>
// Number section slides in document order. A CSS counter alone can't do this:
// reveal.js hides far-away slides with display: none, and hidden elements
// don't increment counters, so every section would read "01".
(function () {
  var sections = document.querySelectorAll(".reveal .slides section.level1:not(#title-slide)");
  sections.forEach(function (section, i) {
    var n = String(i + 1).padStart(2, "0");
    section.style.setProperty("--riso-section", '"' + n + '"');
  });
})();
</script>
