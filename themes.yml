# Registry of themes shown on the landing page.
# Each entry needs a matching extension in _extensions/<id>/ and a page in themes/<id>.qmd.
- title: Riso Zine
  path: themes/riso.html
  image: screenshots/riso/title.png
  description: >
    Two risograph inks on uncoated paper. Fluorescent pink over medium blue,
    overprinting to violet, with halftone fields and misregistered type.
- title: Nocturne
  path: themes/nocturne.html
  image: screenshots/nocturne/title.png
  description: >
    Dark keynote, stage-ready. Serif drama on near-black, quiet orbit lines
    and one luminous lime accent that the italics carry.
- title: Blueprint
  path: themes/blueprint.html
  image: screenshots/blueprint/title.png
  description: >
    Technical drawing on cyanotype blue. A faint 16/80 px grid, dimension
    lines, a title block on the cover and detail callouts on code.
- title: Scholar
  path: themes/scholar.html
  image: screenshots/scholar/title.png
  description: >
    The journal article, projected. Book serifs, booktabs tables, running
    heads, small-caps labels and theorem-style remarks.
